name: Pico Web backend CI

on:
  push:
    branches: [master, 'agent/**']
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q --cov=backend --cov-report=term-missing --cov-fail-under=80
